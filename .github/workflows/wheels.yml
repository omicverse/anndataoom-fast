name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # conda-forge's libomp targets macOS 11 (arm64) / 10.13 (x86_64), unlike
      # Homebrew's, which targets the runner's macOS and would make the wheels
      # installable on the newest macOS only.
      - uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'macOS'
        with:
          environment-name: omp
          create-args: llvm-openmp
          init-shell: none
      - name: libomp (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "OpenMP_ROOT=$MAMBA_ROOT_PREFIX/envs/omp" >> "$GITHUB_ENV"
          if [ "$(uname -m)" = "arm64" ]; then T=11.0; else T=10.15; fi
          echo "MACOSX_DEPLOYMENT_TARGET=$T" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v3.2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build_wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
