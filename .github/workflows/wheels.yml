name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # conda-forge's libomp targets macOS 11 (both arches), unlike
      # Homebrew's, which targets the runner's macOS and would make the wheels
      # installable on the newest macOS only.
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - name: libomp (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install zstandard
          python .github/scripts/fetch_libomp.py "$RUNNER_TEMP/omp"
          echo "OpenMP_ROOT=$RUNNER_TEMP/omp" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v3.2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build_wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
