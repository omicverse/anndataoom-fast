name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # conda-forge's libomp targets macOS 11 (both arches), unlike
      # Homebrew's, which targets the runner's macOS and would make the wheels
      # installable on the newest macOS only.
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - name: libomp (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install zstandard
          python .github/scripts/fetch_libomp.py "$RUNNER_TEMP/omp"
          echo "OpenMP_ROOT=$RUNNER_TEMP/omp" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v3.2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # glibc 2.17 wheels for older Linux (CentOS/RHEL 7-based HPC clusters).
  # Recent h5py releases only ship manylinux_2_28 wheels, so the tests install
  # h5py < 3.15 here; CPython 3.14 has no such h5py, so it is built but not
  # tested in this image (the same code is tested on every other platform).
  build_wheels_2014:
    name: wheels manylinux2014 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_TEST_REQUIRES: "pytest scikit-learn"
          # Every pip install in the container (including the wheel's own
          # dependencies, installed before test-requires) takes the newest
          # release that has a glibc 2.17 wheel, as users on such systems get.
          CIBW_ENVIRONMENT_LINUX: PIP_ONLY_BINARY=:all:
          CIBW_TEST_SKIP: "cp314-*"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux2014-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build_wheels, build_wheels_2014, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
