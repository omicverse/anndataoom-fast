[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "anndataoom-fast"
version = "0.1.0.dev0"
description = "Multithreaded C++ kernels for out-of-core single-cell preprocessing on top of anndataoom"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "omicverse contributors" }]
dependencies = ["numpy>=1.23", "scipy>=1.8", "h5py>=3.8", "threadpoolctl>=3"]

[project.optional-dependencies]
oom = ["anndataoom>=0.1.8"]
test = ["pytest", "anndataoom>=0.1.8", "scikit-learn"]

[tool.scikit-build]
wheel.packages = ["python/anndataoom_fast"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
AOF_NATIVE = { env = "AOF_NATIVE", default = "OFF" }
