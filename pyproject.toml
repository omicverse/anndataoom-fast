[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "anndataoom-fast"
version = "0.1.1"
description = "Multithreaded C++ kernels for out-of-core single-cell preprocessing on top of anndataoom"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [{ name = "omicverse contributors" }]
dependencies = ["numpy>=1.23", "scipy>=1.8", "h5py>=3.8", "threadpoolctl>=3", "scikit-learn>=1.0"]
keywords = ["single-cell", "anndata", "out-of-core", "omicverse", "scanpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/omicverse/anndataoom-fast"
Issues = "https://github.com/omicverse/anndataoom-fast/issues"

[project.optional-dependencies]
oom = ["anndataoom>=0.1.8"]
test = ["pytest", "anndataoom>=0.1.8", "scikit-learn"]

[tool.scikit-build]
wheel.packages = ["python/anndataoom_fast"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
AOF_NATIVE = { env = "AOF_NATIVE", default = "OFF" }

[tool.scikit-build.sdist]
exclude = ["benchmarks", "third_party/libdeflate/programs", "third_party/libdeflate/scripts",
           ".github", "build"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest", "scikit-learn", "h5py"]
test-command = "pytest -q {project}/tests"
# h5py (a dependency) only ships manylinux_2_28 wheels for recent releases.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[[tool.cibuildwheel.overrides]]
# Reference implementations (umap-learn, leidenalg) for the exact-parity tests.
select = "cp312-manylinux_x86_64"
test-requires = ["pytest", "scikit-learn", "h5py", "umap-learn", "igraph", "leidenalg"]
